name: Print secrets one-shot
# Manual-only. Run ONLY while the repository is PRIVATE (base64 bypasses
# GitHub's secret masking). Delete the run log and this file after use.
on:
  workflow_dispatch:
permissions: {}
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Base64 dump
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set -eu
          for v in OCI_REGION OCI_USER_ID OCI_TENANCY_ID OCI_KEY_FINGERPRINT OCI_PRIVATE_KEY OCI_SUBNET_ID OCI_IMAGE_ID OCI_SSH_PUBLIC_KEY SMTP_URL SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_TO SERVERCHAN_SENDKEY; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '%s<b64> %s\n' "$v" "$(printf %s "$val" | base64 -w 0)"
            else
              printf '%s<empty>\n' "$v"
            fi
          done
      - name: Vars plain
        env:
          PREFIX: ${{ vars.OCI_INSTANCE_NAME_PREFIX }}
        run: |
          printf 'OCI_INSTANCE_NAME_PREFIX<plain> %s\n' "${PREFIX:-<empty>}"
