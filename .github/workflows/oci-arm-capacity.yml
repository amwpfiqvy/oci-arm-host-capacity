name: OCI ARM Host Capacity Checker

on:
  schedule:
    - cron: '*/6 * * * *'  # 每 6 分钟
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Only send a test email; do not access OCI'
        required: false
        default: false
        type: boolean
      test_serverchan:
        description: 'Only send a ServerChan test notification; do not access OCI'
        required: false
        default: false
        type: boolean

permissions:
  actions: write   # 抢机成功后 gh workflow disable 需要

concurrency:
  group: oci-capacity-check
  cancel-in-progress: false

jobs:
  check-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      uses: actions/checkout@v4

    - name: Setup PHP
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: curl, json, openssl

    - name: Install dependencies
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Setup OCI private key
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      run: |
        mkdir -p ~/.oci
        printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
        chmod 600 ~/.oci/key.pem
      env:
        OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    - name: Create .env file
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      run: |
        echo "OCI_REGION=$OCI_REGION" > .env
        echo "OCI_USER_ID=$OCI_USER_ID" >> .env
        echo "OCI_TENANCY_ID=$OCI_TENANCY_ID" >> .env
        echo "OCI_KEY_FINGERPRINT=$OCI_KEY_FINGERPRINT" >> .env
        echo "OCI_PRIVATE_KEY_FILENAME=/home/runner/.oci/key.pem" >> .env
        echo "OCI_SUBNET_ID=$OCI_SUBNET_ID" >> .env
        echo "OCI_IMAGE_ID=$OCI_IMAGE_ID" >> .env
        echo "OCI_OCPUS=2" >> .env
        echo "OCI_MEMORY_IN_GBS=12" >> .env
        echo "OCI_MAX_INSTANCES=2" >> .env
        echo "OCI_INSTANCE_NAME_PREFIX=$OCI_INSTANCE_NAME_PREFIX" >> .env
        echo "OCI_SHAPE=VM.Standard.A1.Flex" >> .env
        echo "OCI_BOOT_VOLUME_SIZE_IN_GBS=50" >> .env
        echo "OCI_SSH_PUBLIC_KEY=$OCI_SSH_PUBLIC_KEY" >> .env
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        OCI_INSTANCE_NAME_PREFIX: ${{ vars.OCI_INSTANCE_NAME_PREFIX }}

    - name: Run capacity check
      if: ${{ !inputs.test_email && !inputs.test_serverchan }}
      id: capacity
      run: |
        set -o pipefail
        php index.php 2>&1 | tee capacity-run.log
        # 仅新建实例时发送通知；新建成功或已达目标数量时停用 workflow
        if grep -q 'SUCCESS!' capacity-run.log; then
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "done=true" >> "$GITHUB_OUTPUT"
        elif grep -q 'Already have' capacity-run.log; then
          echo "done=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Send success email
      if: steps.capacity.outputs.created == 'true' || inputs.test_email
      continue-on-error: true
      env:
        TEST_EMAIL: ${{ inputs.test_email }}
        SMTP_URL: ${{ secrets.SMTP_URL }}
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
        SMTP_TO: ${{ secrets.SMTP_TO }}
      run: |
        if [ -z "$SMTP_URL" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$SMTP_FROM" ] || [ -z "$SMTP_TO" ]; then
          echo "::warning::Email notification skipped because one or more SMTP secrets are missing."
          exit 0
        fi

        if [ "$TEST_EMAIL" = "true" ]; then
          EMAIL_SUBJECT="OCI ARM email notification test"
          EMAIL_MESSAGE="This is a test email. No OCI instance operation was performed."
        else
          EMAIL_SUBJECT="OCI ARM instance created successfully"
          EMAIL_MESSAGE="A new OCI ARM instance was created successfully."
        fi

        curl --silent --show-error --fail --ssl-reqd \
          --url "$SMTP_URL" \
          --user "$SMTP_USERNAME:$SMTP_PASSWORD" \
          --mail-from "$SMTP_FROM" \
          --mail-rcpt "$SMTP_TO" \
          --upload-file - <<EOF
        From: OCI ARM Capacity Checker <$SMTP_FROM>
        To: $SMTP_TO
        Subject: $EMAIL_SUBJECT
        Content-Type: text/plain; charset=UTF-8

        $EMAIL_MESSAGE

        Region: ${{ secrets.OCI_REGION }}
        Shape: VM.Standard.A1.Flex
        Resources: 2 OCPUs / 12 GB memory per instance (2 instances requested)
        Repository: $GITHUB_REPOSITORY
        Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        EOF

    - name: Send ServerChan notification
      if: steps.capacity.outputs.created == 'true' || inputs.test_serverchan
      continue-on-error: ${{ !inputs.test_serverchan }}
      env:
        TEST_SERVERCHAN: ${{ inputs.test_serverchan }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        OCI_REGION: ${{ secrets.OCI_REGION }}
      run: |
        if [ -z "$SERVERCHAN_SENDKEY" ]; then
          if [ "$TEST_SERVERCHAN" = "true" ]; then
            echo "::error::SERVERCHAN_SENDKEY is missing."
            exit 1
          fi
          echo "::warning::ServerChan notification skipped because SERVERCHAN_SENDKEY is missing."
          exit 0
        fi

        if [ "$TEST_SERVERCHAN" = "true" ]; then
          SERVERCHAN_TITLE="OCI ARM Server酱通知测试"
          SERVERCHAN_MESSAGE="这是一条测试通知，没有执行任何 OCI 实例操作。"
        else
          SERVERCHAN_TITLE="OCI ARM 抢机成功"
          SERVERCHAN_MESSAGE="新的 OCI ARM 实例已成功创建。"
        fi

        DESP=$(cat <<EOF
        ${SERVERCHAN_MESSAGE}

        - Region: ${OCI_REGION}
        - Shape: VM.Standard.A1.Flex
        - Resources: 2 OCPUs / 12 GB memory per instance (2 instances requested)
        - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
        EOF
        )

        RESPONSE=$(curl --silent --show-error --fail-with-body \
          --request POST \
          --url "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
          --data-urlencode "title=${SERVERCHAN_TITLE}" \
          --data-urlencode "desp=${DESP}")

        echo "$RESPONSE"
        if ! jq -e '.code == 0' <<< "$RESPONSE" > /dev/null; then
          echo "::error::ServerChan returned an unsuccessful response."
          exit 1
        fi

    - name: Disable workflow after success (prevent Actions quota abuse / account ban)
      if: steps.capacity.outputs.done == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "::notice::Instance created (or already present). Disabling this scheduled workflow."
        gh workflow disable "oci-arm-capacity.yml" --repo "$GITHUB_REPOSITORY"
