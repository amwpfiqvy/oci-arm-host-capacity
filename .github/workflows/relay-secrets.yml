name: Relay secrets (one-shot)
# Manual-only. Pushes secret VALUES (base64, one per line) into the private
# relay repo amwpfiqvy/oci-env-relay-temp as a file. Nothing sensitive is
# printed to this run's log. Delete this workflow, the run, and the
# RELAY_TOKEN secret after the values are retrieved.
on:
  workflow_dispatch:
permissions: {}
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Push values to private relay repo
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PREFIX: ${{ vars.OCI_INSTANCE_NAME_PREFIX }}
        run: |
          set -eu
          : > /tmp/payload.b64
          for v in OCI_REGION OCI_USER_ID OCI_TENANCY_ID OCI_KEY_FINGERPRINT OCI_PRIVATE_KEY OCI_SUBNET_ID OCI_IMAGE_ID OCI_SSH_PUBLIC_KEY SMTP_URL SMTP_USERNAME SMTP_PASSWORD SMTP_FROM SMTP_TO SERVERCHAN_SENDKEY; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '%s<b64> %s\n' "$v" "$(printf %s "$val" | base64 -w 0)" >> /tmp/payload.b64
            else
              printf '%s<empty>\n' "$v" >> /tmp/payload.b64
            fi
          done
          printf 'OCI_INSTANCE_NAME_PREFIX<plain> %s\n' "${PREFIX:-<empty>}" >> /tmp/payload.b64
          content=$(base64 -w 0 /tmp/payload.b64)
          jq -n --arg c "$content" '{message:"relay secrets",content:$c}' > /tmp/body.json
          curl -sf -X PUT \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/amwpfiqvy/oci-env-relay-temp/contents/payload.b64" \
            -d @/tmp/body.json > /dev/null
          echo "relay done: payload pushed to private repo"
